openapi: 3.0.3
info:
  title: FairGiG Grievance Node API
  description: |
    Express service for grievances, analytics, and certificate endpoints.
    Interactive docs are available at /api-docs.
    Grievances, analytics, certificates, and worker community require `Authorization: Bearer` (Supabase access token).
  version: 0.2.0

servers:
  - url: http://localhost:5000
    description: Local
  - url: /
    description: Same-origin host

tags:
  - name: System
    description: Service liveness and integration checks
  - name: Documentation
    description: OpenAPI document routes
  - name: Auth
    description: Signup/login (anon key), JWT (Supabase access token) for /me, profiles
  - name: Grievances
    description: |
      Grievance CRUD (JWT). Workers see and edit only their rows; verifier/advocate may filter by any worker_id or manage all.
  - name: Analytics
    description: |
      Benchmarks (JWT). Workers may only query their own city_zone; vulnerability flags are verifier/advocate only.
  - name: Certificates
    description: |
      Verified earnings for a worker (JWT). Workers may only request their own workerId; staff may request any.
  - name: BFF Python
    description: |
      Proxied to FastAPI (earnings / anomaly). Same Bearer token as other APIs. Full schemas in Python Swagger (e.g. :8000/docs).
  - name: Community
    description: |
      Worker bulletin (4th persona): anonymous to peers on the public feed; advocates moderate (pending → visible/hidden/removed).

paths:
  /:
    get:
      tags: [System]
      summary: Root endpoint
      operationId: getRoot
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMessage"

  /health:
    get:
      tags: [System]
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHealth"

  /services/health:
    get:
      tags: [System]
      summary: Downstream health checks
      operationId: getServicesHealth
      responses:
        "200":
          description: Downstream probe status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServicesHealth"

  /openapi.yaml:
    get:
      tags: [Documentation]
      summary: Fetch OpenAPI YAML
      operationId: getOpenApiYaml
      responses:
        "200":
          description: YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /openapi.json:
    get:
      tags: [Documentation]
      summary: Fetch OpenAPI JSON
      operationId: getOpenApiJson
      responses:
        "200":
          description: JSON specification
          content:
            application/json:
              schema:
                type: object

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Current user + profile
      description: |
        Send `Authorization: Bearer <access_token>` from Supabase Auth (same token the frontend gets after sign-in).
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User and optional profile row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          description: Missing or invalid token
        "503":
          description: Server missing Supabase env

  /api/v1/verifier/ping:
    get:
      tags: [Auth]
      summary: Verifier-only probe (role template)
      operationId: getVerifierPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller has verifier role
        "401":
          description: Invalid token
        "403":
          description: Wrong role or no profile

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Register with email and password
      description: |
        Creates a Supabase Auth user. Profile rows are created by DB trigger (`worker` role only).
        If email confirmation is enabled, `session` may be null until the user confirms.
        Response includes `profile` (with `role`) when the server can read `public.profiles` (requires `SUPABASE_SERVICE_ROLE_KEY` on the API).
      operationId: postAuthSignup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                full_name:
                  type: string
                  description: Stored in user metadata; copied to profiles by trigger when present.
                city_zone:
                  type: string
      responses:
        "201":
          description: User created (session may be null if confirmation required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSession"
        "400":
          description: Validation or Supabase signup error
        "503":
          description: Server missing SUPABASE_ANON_KEY

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      description: |
        Returns a Supabase session and `profile` (including `role`) for the frontend when profile lookup is available.
        Use `access_token` as `Authorization: Bearer` for `/api/v1/me`.
      operationId: postAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAuthSession"
        "400":
          description: Bad request
        "401":
          description: Invalid credentials, unconfirmed email, or no session
        "503":
          description: Server missing SUPABASE_ANON_KEY

  /api/v1/earnings/status:
    get:
      tags: [BFF Python]
      summary: Earnings service status (proxied)
      description: Forwards to FastAPI GET /api/v1/status.
      operationId: bffEarningsStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Earnings API envelope
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "503":
          description: EARNINGS_SERVICE_URL not set

  /api/v1/earnings/shift-logs:
    get:
      tags: [BFF Python]
      summary: List shift logs (proxied)
      description: Forwards to FastAPI GET /api/v1/shift-logs (query params preserved).
      operationId: bffEarningsListShiftLogs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Shift logs list
        "401":
          description: Missing or invalid token
    post:
      tags: [BFF Python]
      summary: Create shift log (proxied)
      description: Forwards to FastAPI POST /api/v1/shift-logs (JSON body stream).
      operationId: bffEarningsCreateShiftLog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Created
        "401":
          description: Missing or invalid token

  /api/v1/earnings/shift-logs/import-csv:
    post:
      tags: [BFF Python]
      summary: Import shift logs CSV (proxied)
      description: Forwards multipart body to FastAPI POST /api/v1/shift-logs/import-csv.
      operationId: bffEarningsImportCsv
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import summary
        "401":
          description: Missing or invalid token

  /api/v1/earnings/shift-logs/{shiftLogId}:
    get:
      tags: [BFF Python]
      summary: Get shift log (proxied)
      operationId: bffEarningsGetShiftLog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: shiftLogId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Shift log
        "401":
          description: Missing or invalid token

  /api/v1/earnings/shift-logs/{shiftLogId}/verification:
    patch:
      tags: [BFF Python]
      summary: Verifier update status (proxied)
      operationId: bffEarningsVerification
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: shiftLogId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
        "401":
          description: Missing or invalid token

  /api/v1/anomaly/status:
    get:
      tags: [BFF Python]
      summary: Anomaly service status (proxied)
      description: Forwards to FastAPI GET /api/v1/status.
      operationId: bffAnomalyStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Anomaly API envelope
        "401":
          description: Missing or invalid token
        "503":
          description: ANOMALY_SERVICE_URL not set

  /api/grievances:
    get:
      tags: [Grievances]
      summary: List grievances
      operationId: listGrievances
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: worker_id
          description: Verifier/advocate only; ignored for workers (always scoped to caller).
          schema:
            type: string
        - in: query
          name: platform
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [open, escalated, resolved]
        - in: query
          name: tag
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "200":
          description: Grievances list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGrievanceList"
    post:
      tags: [Grievances]
      summary: Create grievance
      operationId: createGrievance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, category, description]
              properties:
                worker_id:
                  type: string
                  description: Required for verifier/advocate; ignored for workers (uses JWT subject).
                platform:
                  type: string
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [open, escalated, resolved]
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile or worker cannot set worker_id for others
        "201":
          description: Grievance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGrievance"

  /api/grievances/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Grievances]
      summary: Get grievance by id
      operationId: getGrievanceById
      security:
        - bearerAuth: []
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "404":
          description: Not found or not visible to this role
        "200":
          description: Grievance record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGrievance"
    patch:
      tags: [Grievances]
      summary: Update grievance
      operationId: updateGrievance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                category:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [open, escalated, resolved]
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "404":
          description: Not found or not owned
        "200":
          description: Updated grievance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGrievance"
    delete:
      tags: [Grievances]
      summary: Delete grievance
      operationId: deleteGrievance
      security:
        - bearerAuth: []
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "404":
          description: Not found or not owned
        "200":
          description: Delete confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDeleted"

  /api/grievances/{id}/tags:
    post:
      tags: [Grievances]
      summary: Add tags to grievance
      operationId: addGrievanceTags
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile
        "404":
          description: Not found or not owned
        "200":
          description: Updated grievance with merged tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGrievance"

  /api/analytics/benchmarks/platform-city:
    get:
      tags: [Analytics]
      summary: Benchmark pay for platform and city
      description: Workers may only use city_zone matching their profile.
      operationId: getPlatformCityBenchmark
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: platform
          required: true
          schema:
            type: string
        - in: query
          name: city_zone
          required: true
          schema:
            type: string
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile or worker city mismatch
        "200":
          description: Benchmark payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBenchmark"

  /api/analytics/vulnerability-flags:
    get:
      tags: [Analytics]
      summary: Workers with month-on-month income drop
      description: Verifier or advocate role only.
      operationId: getVulnerabilityFlags
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: threshold
          schema:
            type: number
            default: 20
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: Wrong role (worker not allowed)
        "200":
          description: Vulnerability flags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVulnerability"

  /api/certificates/workers/{workerId}/verified-logs:
    get:
      tags: [Certificates]
      summary: Verified logs for worker certificate
      description: Workers may only use their own workerId path parameter.
      operationId: getWorkerCertificateLogs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: workerId
          required: true
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        "401":
          description: Missing or invalid token
        "403":
          description: No profile or cannot access another worker
        "200":
          description: Worker verified logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCertificate"

  /api/community/feed:
    get:
      tags: [Community]
      summary: Community feed (no author)
      description: |
        Only visible posts; peers never see who wrote them.
        Search matches title, body, or category (case-insensitive, server-side).
        Pagination: `total` is the full match count; `returned` is this page length.
        Each item includes `upvote_count`, `comment_count`, and `viewer_upvoted` when `database/community_engagement.sql` is applied.
      operationId: getCommunityFeed
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: platform
          schema:
            type: string
        - in: query
          name: search
          description: Substring match on title, body, or category (wildcards % and _ stripped).
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: |
            Feed items and pagination with `total` (matching rows) and `returned` (items in this response).
        "401":
          description: Missing or invalid token

  /api/community/mine:
    get:
      tags: [Community]
      summary: My community posts
      description: Worker role only.
      operationId: getCommunityMine
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Own posts with moderation fields
        "403":
          description: Not a worker

  /api/community:
    post:
      tags: [Community]
      summary: Create community post
      description: Worker only; status starts pending until advocate approves.
      operationId: createCommunityPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                title:
                  type: string
                body:
                  type: string
                platform:
                  type: string
                category:
                  type: string
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: Created
        "403":
          description: Not a worker

  /api/community/moderation:
    get:
      tags: [Community]
      summary: Moderation queue
      description: |
        Advocate only; responses include author_id.
        Pagination: `limit` (default 50, max 200), `offset` (max 5000); body includes `pagination.total` and `pagination.returned`.
      operationId: getCommunityModeration
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, visible, hidden, removed]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Posts for moderation with pagination
        "403":
          description: Not an advocate

  /api/community/{id}/upvote:
    post:
      tags: [Community]
      summary: Toggle upvote on a visible post
      description: One upvote per user per post; calling again removes the upvote.
      operationId: toggleCommunityPostUpvote
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New counts after toggle
        "404":
          description: Post not visible or missing

  /api/community/{id}/comments:
    get:
      tags: [Community]
      summary: List comments (visible posts only)
      description: Anonymous — no author fields returned.
      operationId: getCommunityPostComments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            default: 80
      responses:
        "200":
          description: Comments
        "404":
          description: Post not found
    post:
      tags: [Community]
      summary: Add comment on a visible post
      operationId: createCommunityPostComment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 4000
      responses:
        "201":
          description: Created
        "404":
          description: Post not open for comments

  /api/community/{id}:
    patch:
      tags: [Community]
      summary: Moderate or edit pending post
      description: |
        Advocate may set `status` (visible, hidden, or removed only), `moderator_note`, and `tags`.
        Worker may edit own post only while status is pending (`title`, `body`, `platform`, `category`, `tags`); workers must not send `status`.
      operationId: patchCommunityPost
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Advocate only. Cannot set back to pending.
                  enum: [visible, hidden, removed]
                moderator_note:
                  type: string
                  nullable: true
                tags:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                title:
                  type: string
                body:
                  type: string
                platform:
                  type: string
                category:
                  type: string
      responses:
        "200":
          description: Updated
        "403":
          description: Not allowed
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access_token (not service_role)

  schemas:
    Grievance:
      type: object
      properties:
        id:
          type: string
        worker_id:
          type: string
        platform:
          type: string
        category:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, escalated, resolved]
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    EnvelopeMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: FairGiG grievance node service is running
        error:
          nullable: true

    EnvelopeHealth:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            service:
              type: string
              example: fairgig-service-grievance-node
            status:
              type: string
              example: ok
        error:
          nullable: true

    EnvelopeServicesHealth:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            services:
              type: array
              items:
                type: object
                properties:
                  service:
                    type: string
                  reachable:
                    type: boolean
                  statusCode:
                    nullable: true
                    type: integer
            message:
              type: string
        error:
          nullable: true

    EnvelopeGrievance:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            grievance:
              $ref: "#/components/schemas/Grievance"
        error:
          nullable: true

    EnvelopeGrievanceList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Grievance"
            pagination:
              type: object
              properties:
                limit:
                  type: integer
                offset:
                  type: integer
                count:
                  type: integer
        error:
          nullable: true

    EnvelopeDeleted:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            deleted:
              type: boolean
            id:
              type: string
        error:
          nullable: true

    EnvelopeBenchmark:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            platform:
              type: string
            city_zone:
              type: string
            metric:
              type: string
              example: median_hourly_pay
            median_hourly_pay:
              type: number
            average_hourly_pay:
              type: number
            sample_size:
              type: integer
        error:
          nullable: true

    EnvelopeVulnerability:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            threshold_percentage:
              type: number
            count:
              type: integer
            workers:
              type: array
              items:
                type: object
                properties:
                  worker_id:
                    type: string
                  worker_name:
                    nullable: true
                    type: string
                  city_zone:
                    nullable: true
                    type: string
                  previous_month:
                    type: string
                  current_month:
                    type: string
                  previous_month_income:
                    type: number
                  current_month_income:
                    type: number
                  drop_percentage:
                    type: number
        error:
          nullable: true

    EnvelopeCertificate:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            worker:
              type: object
              properties:
                id:
                  type: string
                full_name:
                  type: string
                city_zone:
                  type: string
                role:
                  type: string
            filters:
              type: object
              properties:
                from:
                  nullable: true
                  type: string
                to:
                  nullable: true
                  type: string
            summary:
              type: object
              properties:
                total_verified_logs:
                  type: integer
                total_hours:
                  type: number
                total_gross:
                  type: number
                total_deductions:
                  type: number
                total_net:
                  type: number
            logs:
              type: array
              items:
                type: object
        error:
          nullable: true

    EnvelopeMe:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
            profile:
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [worker, verifier, advocate]
                city_zone:
                  type: string
                  nullable: true
                created_at:
                  type: string
                  format: date-time
        error:
          nullable: true

    AuthSession:
      type: object
      nullable: true
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: integer
        token_type:
          type: string

    AuthUserBrief:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email_confirmed_at:
          type: string
          nullable: true
          format: date-time

    EnvelopeAuthSession:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            session:
              $ref: "#/components/schemas/AuthSession"
            user:
              $ref: "#/components/schemas/AuthUserBrief"
            profile:
              nullable: true
              description: From public.profiles; null if row missing or service role not configured on API
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [worker, verifier, advocate]
                city_zone:
                  type: string
                  nullable: true
                created_at:
                  type: string
                  format: date-time
        error:
          nullable: true
