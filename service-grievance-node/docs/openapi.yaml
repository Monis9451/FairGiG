openapi: 3.0.3
info:
  title: FairGiG Node API
  description: |
    Grievance / analytics / certificate service (Express). **Edit this file** in the repo; Swagger UI at `/api-docs` loads it on server start.
  version: 0.1.0

servers:
  - url: http://localhost:5000
    description: Local (override PORT in `.env` if needed)
  - url: /
    description: Same origin (Try it out uses current host)

tags:
  - name: System
    description: Health and gateway checks
  - name: Auth
    description: JWT (Supabase access token) + profiles

paths:
  /:
    get:
      tags: [System]
      summary: Root
      operationId: getRoot
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMessage"

  /health:
    get:
      tags: [System]
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeHealth"

  /services/health:
    get:
      tags: [System]
      summary: Downstream Python services (optional)
      description: |
        Probes `ANOMALY_SERVICE_URL` and `ANALYTICS_SERVICE_URL` `/health` when those env vars are set.
      operationId: getServicesHealth
      responses:
        "200":
          description: Probe results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServicesHealth"

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Current user + profile
      description: |
        Send `Authorization: Bearer <access_token>` from Supabase Auth (same token the frontend gets after sign-in).
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User and optional profile row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          description: Missing or invalid token
        "503":
          description: Server missing Supabase env

  /api/v1/verifier/ping:
    get:
      tags: [Auth]
      summary: Verifier-only probe (role template)
      operationId: getVerifierPing
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller has verifier role
        "401":
          description: Invalid token
        "403":
          description: Wrong role or no profile

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase user access_token (not service_role)

  schemas:
    EnvelopeMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            message:
              type: string
              example: FairGiG backend is running
        error:
          nullable: true
          example: null

    EnvelopeHealth:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            service:
              type: string
              example: fairgig-backend
            status:
              type: string
              example: ok
        error:
          nullable: true

    EnvelopeServicesHealth:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            services:
              type: array
              items:
                type: object
                properties:
                  service:
                    type: string
                  reachable:
                    type: boolean
                  statusCode:
                    nullable: true
                    type: integer
            message:
              type: string
              description: Present when no downstream URLs are configured
        error:
          nullable: true

    EnvelopeMe:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
            profile:
              nullable: true
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                full_name:
                  type: string
                  nullable: true
                role:
                  type: string
                  enum: [worker, verifier, advocate]
                city_zone:
                  type: string
                  nullable: true
                created_at:
                  type: string
                  format: date-time
        error:
          nullable: true
